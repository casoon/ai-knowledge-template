[package]
name = "knowledge-lint"
version = "0.1.0"
edition = "2021"
description = "Validates a knowledge/ tree against _types.yml: frontmatter completeness, status values, type/folder consistency, related-links, staleness, SOPS-encrypted secrets, and attachment references"
license = "CC-BY-4.0"

[[bin]]
name = "knowledge-lint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
gray_matter = "0.2"
walkdir = "2"
anyhow = "1"
chrono = "0.4"
ureq = "3"
